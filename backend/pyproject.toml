[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openvoice-lab-backend"
version = "0.1.0"
description = "Self-hosted open-weight TTS backend for OpenVoice Lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "kokoro-onnx==0.6.1",
    "numpy>=2.0.2,<3.0",
    "psutil>=6.1,<8.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
experiment = [
    "sentencepiece==0.2.0",
    "soundfile==0.12.1",
    "speechbrain==1.0.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers==4.44.2",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "integration: requires locally provisioned model artifacts",
]
